services:
  n8n-import:
    image: n8nio/n8n:1.96.0
    entrypoint: /bin/sh
    command: ["-c", "n8n import:workflow --separate --input=/workflows && n8n update:workflow --all --active=true"]
    environment:
      N8N_ENCRYPTION_KEY: local-dev-encryption-key
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    restart: "no"

  n8n:
    image: n8nio/n8n:1.96.0
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    ports:
      - "${N8N_PUBLIC_PORT:-5678}:5678"
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_ENCRYPTION_KEY: local-dev-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      WEBHOOK_URL: "http://localhost:${N8N_PUBLIC_PORT:-5678}/"
    volumes:
      - n8n_data:/home/node/.n8n

  kiosk:
    build:
      context: ../../apps/kiosk
      args:
        VITE_BACKEND_MODE: http
        VITE_SEARCH_WEBHOOK_URL: /webhook/search
        VITE_PRINT_WEBHOOK_URL: /webhook/print
    depends_on:
      - n8n
    ports:
      - "${KIOSK_PUBLIC_PORT:-5173}:80"

volumes:
  n8n_data:
