services:
  n8n-import:
    image: nirvana-n8n:local
    entrypoint: /bin/sh
    command: ["-c", "n8n import:workflow --separate --input=/workflows && n8n update:workflow --all --active=true"]
    environment:
      N8N_ENCRYPTION_KEY: local-dev-encryption-key
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    restart: "no"

  n8n:
    build:
      context: ../n8n
    image: nirvana-n8n:local
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    ports:
      - "${N8N_PUBLIC_PORT:-5678}:5678"
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_ENCRYPTION_KEY: local-dev-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      NIRVANA_PRINT_MODE: "${NIRVANA_PRINT_MODE:-mock}"
      NIRVANA_PRINTER_NAME: "${NIRVANA_PRINTER_NAME:-}"
      CUPS_SERVER: "${CUPS_SERVER:-}"
      SEARXNG_BASE_URL: "http://searxng:8080"
      WEBHOOK_URL: "http://localhost:${N8N_PUBLIC_PORT:-5678}/"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PUBLIC_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PUBLIC_PORT:-8080}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-local-dev-searxng-secret}"
    restart: unless-stopped

  kiosk:
    build:
      context: ../../apps/kiosk
      args:
        VITE_BACKEND_MODE: http
        VITE_SEARCH_WEBHOOK_URL: /webhook/search
        VITE_PRINT_WEBHOOK_URL: /webhook/print
    depends_on:
      - n8n
    ports:
      - "${KIOSK_PUBLIC_PORT:-5173}:80"

volumes:
  n8n_data:
