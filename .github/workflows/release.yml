name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'nirvana-kiosk' }}

jobs:
  release:
    name: Semantic release and Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kiosk/package-lock.json

      - name: Install kiosk dependencies
        working-directory: apps/kiosk
        run: npm ci

      - name: Test kiosk app
        working-directory: apps/kiosk
        run: npm test

      - name: Build kiosk app
        working-directory: apps/kiosk
        run: npm run build

      - name: Validate Docker Compose config
        run: docker compose -f automation/deploy/docker-compose.yml config

      - name: Check DockerHub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$DOCKERHUB_REPOSITORY"

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.semantic.outputs.new_release_published == 'true'
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semantic.outputs.new_release_version }}
            type=raw,value=${{ steps.semantic.outputs.new_release_git_tag }}
            type=sha,prefix=sha-

      - name: Build and push kiosk image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/kiosk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VITE_BACKEND_MODE=http
            VITE_SEARCH_WEBHOOK_URL=/webhook/search
            VITE_PRINT_WEBHOOK_URL=/webhook/print
