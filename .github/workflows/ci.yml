name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kiosk/package-lock.json

      - name: Install kiosk dependencies
        working-directory: apps/kiosk
        run: npm ci

      - name: Test kiosk app
        working-directory: apps/kiosk
        run: npm test

      - name: Build kiosk app
        working-directory: apps/kiosk
        run: npm run build

      - name: Validate Docker Compose config
        run: docker compose -f automation/deploy/docker-compose.yml config

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build kiosk container
        uses: docker/build-push-action@v7
        with:
          context: apps/kiosk
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nirvana-kiosk:ci
          build-args: |
            VITE_BACKEND_MODE=http
            VITE_SEARCH_WEBHOOK_URL=/webhook/search
            VITE_PRINT_WEBHOOK_URL=/webhook/print
