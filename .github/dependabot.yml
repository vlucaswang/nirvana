version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/kiosk
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      kiosk-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /apps/kiosk
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      kiosk-docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
